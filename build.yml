name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # يتيح التشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المستودع يحتوي lib/ و pubspec.yaml فقط، فنولّد مجلد android تلقائياً
      - name: Generate Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/backup
            cp -r lib pubspec.yaml /tmp/backup/
            flutter create --org com.example --project-name sms_campaign --platforms android .
            rm -rf lib pubspec.yaml test
            cp -r /tmp/backup/lib /tmp/backup/pubspec.yaml .
          fi

      - name: Patch AndroidManifest (permissions + background service)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.SEND_SMS' not in s:
              if 'xmlns:tools' not in s:
                  s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              perms = '''
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
          '''
              s = s.replace('<application', perms + '\n    <application', 1)
              service = '''
              <service
                  android:name="id.flutter.flutter_background_service.BackgroundService"
                  android:foregroundServiceType="dataSync"
                  android:exported="true"
                  tools:replace="android:exported,android:foregroundServiceType"/>
          '''
              s = s.replace('</application>', service + '\n    </application>', 1)
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Set minSdk to 23
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-campaign-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
