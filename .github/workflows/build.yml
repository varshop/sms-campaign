name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ثبّتنا خط 3.41 لضمان بناء متكرر ومستقر. آخر تحديث (patch) من هذا الخط يُستخدم تلقائياً.
  FLUTTER_VERSION: '3.41.x'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      # المستودع يحتوي: lib/ و pubspec.yaml و AndroidManifest.xml و MainActivity.kt فقط.
      # نولّد هيكل أندرويد الحديث (Gradle Kotlin DSL + Embedding v2) ثم نعيد ملفاتنا فوقه.
      - name: Generate Android project
        run: |
          set -euo pipefail
          KT=android/app/src/main/kotlin/com/example/sms_campaign/MainActivity.kt
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/AndroidManifest.xml
          cp "$KT" /tmp/keep/MainActivity.kt

          rm -rf android lib pubspec.yaml
          flutter create --org com.example --project-name sms_campaign --platforms android .

          rm -rf lib test analysis_options.yaml pubspec.yaml android/app/src/main/kotlin
          mkdir -p "$(dirname "$KT")"
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/keep/MainActivity.kt "$KT"

          grep -n "namespace\|applicationId" android/app/build.gradle* || true

      - name: Limit Gradle memory
        run: |
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError' >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-campaign-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
